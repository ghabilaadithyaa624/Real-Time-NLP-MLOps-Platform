name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "arena/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Python and manifests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]
    steps:
      - name: Check out source
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install development dependencies
        run: python -m pip install --requirement requirements-dev.txt

      - name: Ruff lint
        run: ruff check app training tests

      - name: Bandit security scan
        run: bandit --quiet --recursive app training --severity-level medium

      - name: Compile Python sources
        run: python -m compileall --quiet app training tests

      - name: Run tests
        run: python -m pytest --quiet tests

  docker:
    name: Build production image
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.10.0

      - name: Build image without pushing
        uses: docker/build-push-action@v6.18.0
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: real-time-nlp-api:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
