name: Release to EKS

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  release:
    name: Build and deploy immutable image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      EKS_CLUSTER_NAME: ${{ vars.EKS_CLUSTER_NAME }}
      K8S_NAMESPACE: customer-feedback
      MLFLOW_TRACKING_URI: ${{ vars.MLFLOW_TRACKING_URI }}
      IAM_ROLE_ARN: ${{ vars.MODEL_ARTIFACT_IAM_ROLE_ARN }}
      ACM_CERTIFICATE_ARN: ${{ vars.ACM_CERTIFICATE_ARN }}
      WAF_ACL_ARN: ${{ vars.WAF_ACL_ARN }}
      API_HOSTNAME: ${{ vars.API_HOSTNAME }}
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4.2.2

      - name: Check required release configuration
        env:
          AWS_DEPLOY_ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
        run: |
          set -eu
          for variable in AWS_REGION ECR_REGISTRY ECR_REPOSITORY EKS_CLUSTER_NAME MLFLOW_TRACKING_URI IAM_ROLE_ARN ACM_CERTIFICATE_ARN WAF_ACL_ARN API_HOSTNAME AWS_DEPLOY_ROLE_ARN; do
            if [ -z "${!variable:-}" ]; then
              echo "Missing required production variable: ${variable}" >&2
              exit 1
            fi
          done

      - name: Configure AWS credentials with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4.2.1
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: github-${{ github.run_id }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.10.0

      - name: Build and push immutable image
        uses: docker/build-push-action@v6.18.0
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4.0.0
        with:
          version: v1.31.4

      - name: Configure EKS access
        run: aws eks update-kubeconfig --region "$AWS_REGION" --name "$EKS_CLUSTER_NAME"

      - name: Render the AWS overlay with release values
        run: |
          set -eu
          kubectl kustomize k8s/overlays/aws > /tmp/feedback-api.yaml
          python - <<'PY'
          import os
          from pathlib import Path

          path = Path("/tmp/feedback-api.yaml")
          rendered = path.read_text(encoding="utf-8")
          replacements = {
              "REPLACE_WITH_ECR_REGISTRY": os.environ["ECR_REGISTRY"],
              "REPLACE_WITH_GIT_SHA": os.environ["IMAGE_TAG"],
              "REPLACE_WITH_MLFLOW_TRACKING_URI": os.environ["MLFLOW_TRACKING_URI"],
              "REPLACE_WITH_IAM_ROLE_ARN": os.environ["IAM_ROLE_ARN"],
              "REPLACE_WITH_ACM_CERTIFICATE_ARN": os.environ["ACM_CERTIFICATE_ARN"],
              "REPLACE_WITH_WAF_ACL_ARN": os.environ["WAF_ACL_ARN"],
              "REPLACE_WITH_API_HOSTNAME": os.environ["API_HOSTNAME"],
          }
          for placeholder, value in replacements.items():
              if not value.strip():
                  raise SystemExit(f"empty release value for {placeholder}")
              rendered = rendered.replace(placeholder, value)
          if "REPLACE_WITH_" in rendered:
              raise SystemExit("unresolved Kubernetes release placeholder")
          path.write_text(rendered, encoding="utf-8")
          PY
          kubectl apply --dry-run=server --filename /tmp/feedback-api.yaml

      - name: Apply manifests
        run: kubectl apply --server-side --filename /tmp/feedback-api.yaml --field-manager github-actions

      - name: Wait for rollout and readiness
        run: |
          kubectl rollout status deployment/feedback-api --namespace "$K8S_NAMESPACE" --timeout=10m
          kubectl wait deployment/feedback-api \
            --namespace "$K8S_NAMESPACE" \
            --for=condition=Available \
            --timeout=60s

      - name: Smoke-test liveness and prediction endpoint
        run: |
          set -eu
          kubectl port-forward --namespace "$K8S_NAMESPACE" service/feedback-api 18000:80 >/tmp/feedback-api-port-forward.log 2>&1 &
          port_forward_pid=$!
          trap 'kill "$port_forward_pid"' EXIT
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:18000/health >/dev/null; then
              break
            fi
            sleep 2
          done
          curl --silent --show-error --fail http://127.0.0.1:18000/health >/dev/null
          curl --silent --show-error --fail \
            --header 'Content-Type: application/json' \
            --data '{"text":"synthetic release smoke check"}' \
            http://127.0.0.1:18000/predict >/dev/null
