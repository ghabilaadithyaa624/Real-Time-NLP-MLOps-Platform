# Shared dataset, preprocessing, and training configuration.
dataset:
  name: stanfordnlp/imdb
  config: plain_text
  # Pinned Hugging Face dataset revision for reproducible downloads.
  revision: e6281661ce1c48d982bc483cf8a173c1bbeb5d31
  train_split: train
  test_split: test
  validation_size: 0.10
  seed: 42
  label_names:
    0: negative
    1: positive
  # null uses the Hugging Face default cache. Set this outside Git when needed.
  cache_dir: null

model:
  name: distilbert-base-uncased
  # Pinned model revision for reproducible tokenizer/model downloads.
  revision: 12040accade4e8a0f71eabdb258fecc2e7e948be

preprocessing:
  max_length: 128
  padding: max_length
  truncation: true

training:
  batch_size: 16
  learning_rate: 2.0e-5
  epochs: 3
