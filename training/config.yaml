# Phase 2 dataset configuration.
# Model and optimization settings will be added in later phases.
dataset:
  name: stanfordnlp/imdb
  config: plain_text
  # Pinned Hugging Face dataset revision for reproducible downloads.
  revision: e6281661ce1c48d982bc483cf8a173c1bbeb5d31
  train_split: train
  test_split: test
  validation_size: 0.10
  seed: 42
  label_names:
    0: negative
    1: positive
  # null uses the Hugging Face default cache. Set this outside Git when needed.
  cache_dir: null
