services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: real-time-nlp-api:local
    environment:
      MODEL_SOURCE: local
      MODEL_PATH: /models/model
      MODEL_VERSION: ${MODEL_VERSION:-local}
      MAX_LENGTH: ${MAX_LENGTH:-128}
      INFERENCE_DEVICE: ${INFERENCE_DEVICE:-cpu}
    volumes:
      # Supply a previously trained Hugging Face checkpoint locally. The
      # directory is read-only and is never copied into the image.
      - ${MODEL_PATH:-./artifacts/training}:/models/model:ro
    ports:
      - "${API_PORT:-8000}:8000"
    init: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

  prometheus:
    image: prom/prometheus:v2.53.5
    profiles: [observability]
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus

  grafana:
    image: grafana/grafana:11.4.0
    profiles: [observability]
    depends_on:
      - prometheus
      - loki
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD before starting the observability profile}
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3000}:3000"

  loki:
    image: grafana/loki:3.3.2
    profiles: [observability]
    command:
      - -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./monitoring/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki
    ports:
      - "${LOKI_PORT:-3100}:3100"

  promtail:
    image: grafana/promtail:3.3.2
    profiles: [observability]
    depends_on:
      - loki
    command:
      - -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ./monitoring/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - promtail-data:/tmp
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro

volumes:
  prometheus-data:
  grafana-data:
  loki-data:
  promtail-data:
